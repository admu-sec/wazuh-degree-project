<!--
  Wazuh Active Response & FIM Configuration
  Project: Optimizing Wazuh SIEM for Threat Detection
  Author: admu-sec
  Date: 2026-02-27
  Version: 1.1
  
  Components:
  - Whitelist (6 IPs)
  - Active Response Commands (3)
  - Active Response Rules (2 automations)
  - File Integrity Monitoring (Linux)
-->

<ossec_config>

  <!-- ============================================ -->
  <!-- WHITELIST                                   -->
  <!-- ============================================ -->

  <global>
    <white_list>127.0.0.1</white_list>
    <white_list>localhost.localdomain</white_list>
    <white_list>10.46.21.108</white_list>  <!-- Wazuh Manager + Dashboard -->
    <white_list>10.46.21.60</white_list>   <!-- Wazuh Indexer -->
    <white_list>192.168.5.97</white_list>  <!-- Windows DC -->
    <white_list>192.168.5.99</white_list>  <!-- Windows W1 -->
    <white_list>192.168.5.100</white_list> <!-- Windows W2 -->
  </global>

  <!-- ============================================ -->
  <!-- ACTIVE RESPONSE COMMANDS                    -->
  <!-- ============================================ -->

  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <command>
    <name>disable-account</name>
    <executable>disable-account</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <command>
    <name>restart-wazuh</name>
    <executable>restart-wazuh</executable>
    <timeout_allowed>no</timeout_allowed>
  </command>

  <!-- ============================================ -->
  <!-- ACTIVE RESPONSE RULES                       -->
  <!-- ============================================ -->

  <!-- SSH Brute Force - Local blocking, 10 minutes -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100002</rules_id>
    <timeout>600</timeout>
  </active-response>

  <!-- Mimikatz & Ransomware - All agents, 1 hour -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>all</location>
    <rules_id>100012,100022</rules_id>
    <timeout>3600</timeout>
  </active-response>

  <!-- ============================================ -->
  <!-- FILE INTEGRITY MONITORING (FIM)             -->
  <!-- ============================================ -->

  <syscheck>
    <disabled>no</disabled>
    <frequency>7200</frequency>  <!-- Scan every 2 hours -->
    <scan_on_start>yes</scan_on_start>
    
    <!-- Standard directories -->
    <directories>/etc,/usr/bin,/usr/sbin</directories>
    <directories>/bin,/sbin,/boot</directories>
    
    <!-- Critical directories - Realtime monitoring -->
    <directories check_all="yes" realtime="yes">/root/.ssh</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron</directories>
    <directories check_all="yes" realtime="yes">/var/ossec/etc</directories>
    
    <!-- Ignore common false positives -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/random.seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/httpd/logs</ignore>
    <ignore>/etc/utmpx</ignore>
    <ignore>/etc/wtmpx</ignore>
    <ignore>/etc/cups/certs</ignore>
    <ignore>/etc/dumpdates</ignore>
    <ignore>/etc/svc/volatile</ignore>
    <ignore>/etc/resolv.conf</ignore>
  </syscheck>

</ossec_config>
