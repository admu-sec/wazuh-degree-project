<!-- ============================================ -->
<!-- ACTIVE RESPONSE CONFIGURATION               -->
<!-- Wazuh SIEM - Automated Incident Response   -->
<!-- ============================================ -->

<!-- Whitelist: Critical Infrastructure -->
<global>
  <!-- Localhost -->
  <white_list>127.0.0.1</white_list>
  <white_list>localhost.localdomain</white_list>
  
  <!-- Wazuh Infrastructure -->
  <white_list>10.46.21.108</white_list>  <!-- Wazuh Manager + Dashboard -->
  <white_list>10.46.21.60</white_list>   <!-- Wazuh Indexer (Elasticsearch) -->
  
  <!-- Monitored Windows Agents -->
  <white_list>192.168.5.97</white_list>  <!-- Windows DC -->
  <white_list>192.168.5.99</white_list>  <!-- Windows W1 -->
  <white_list>192.168.5.100</white_list> <!-- Windows W2 -->
</global>

<!-- Available Commands -->
<command>
  <name>firewall-drop</name>
  <executable>firewall-drop</executable>
  <timeout_allowed>yes</timeout_allowed>
</command>

<command>
  <name>disable-account</name>
  <executable>disable-account</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<command>
  <name>restart-wazuh</name>
  <executable>restart-wazuh</executable>
  <timeout_allowed>no</timeout_allowed>
</command>

<!-- Active Response Rules -->

<!-- SSH Brute Force Protection -->
<active-response>
  <disabled>no</disabled>
  <command>firewall-drop</command>
  <location>local</location>
  <rules_id>100002</rules_id>  <!-- SSH Brute Force -->
  <timeout>600</timeout>        <!-- 10 minutes -->
</active-response>

<!-- Critical Threats: Mimikatz & Ransomware -->
<active-response>
  <disabled>no</disabled>
  <command>firewall-drop</command>
  <location>all</location>
  <rules_id>100012,100022</rules_id>  <!-- Mimikatz, Ransomware -->
  <timeout>3600</timeout>             <!-- 1 hour -->
</active-response>
